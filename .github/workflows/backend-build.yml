#  must be changed
name: kfone-bpm-api-build

# This is the trigger for the workflow, mostly common for all the workflows
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment'
        required: true
        default: dev
        options:
          - sb
          - dev
          - qa1
          - stg
          - prd

jobs:
  Build:
    uses: HayGroup/kfone-common/.github/workflows/docker-build-push-0.0.1.yml@main # Common template for the build jobs, provided by devops team.
    secrets: inherit
    with:
      dockerRepository: 'kfone-bpm/api' # must be changed
      environment: '${{inputs.environment}}'
      workspace: 'backend' # can be used as-is, considering the current template folder structure
